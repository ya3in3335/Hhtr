name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "ccr-39d25050-8vx688", "main", "master" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest runner ships the Android SDK (platform android-34,
      # build-tools 34.0.0, platform-tools) with licenses pre-accepted, so we
      # use it directly instead of the setup-android action (which fails trying
      # to install the obsolete "tools" package).
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ultron-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultron-apk
          path: ultron-debug.apk
          if-no-files-found: error
