name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "ccr-39d25050-8vx688", "main", "master" ]
    paths:
      - "chatbot/**"
      - "resources/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android permissions + cleartext (for mic, location, http backend)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          x = p.read_text()
          perms = [
            "android.permission.INTERNET",
            "android.permission.RECORD_AUDIO",
            "android.permission.MODIFY_AUDIO_SETTINGS",
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
          ]
          lines = "\n".join(f'    <uses-permission android:name="{n}" />' for n in perms if n not in x)
          if lines:
            x = re.sub(r'(<manifest[^>]*>)', r'\1\n' + lines, x, count=1)
          if "usesCleartextTraffic" not in x:
            x = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', x, count=1)
          p.write_text(x)
          print(x)
          PY

      - name: Generate launcher icon + splash from the image
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0a0a' --splashBackgroundColor '#160203'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ultron-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultron-apk
          path: ultron-debug.apk
          if-no-files-found: error
