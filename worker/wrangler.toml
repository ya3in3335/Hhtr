name = "ultron-proxy"
main = "ultron-proxy.js"
compatibility_date = "2024-10-01"
workers_dev = true

# Plain variables (NOT secrets). The admin edits SYSTEM_PROMPT from the
# Cloudflare dashboard (Workers > ultron-proxy > Settings > Variables).
# It is EMPTY by default — no internal prompt is shipped.
[vars]
SYSTEM_PROMPT = ""
MODEL = "qwen/qwen3.8-omni-flash:free"
API_BASE = "https://api.xkiro.com/v1"
REASONING = "false"

# Persistent storage for the admin-edited prompt (KV).
[[kv_namespaces]]
binding = "PROMPT_KV"
id = "995f80940c1f4689b8da4b5032641fdc"

# The provider key (XKIRO sk-xt-…) is stored as a SECRET (never in this file / repo):
#   echo "<key>" | npx wrangler secret put API_KEY
